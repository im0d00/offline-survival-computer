<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Offline Survival Computer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
    }
    .login-header {
      text-align: center;
      padding: 2rem 2rem 0;
    }
    .login-icon {
      font-size: 3rem;
      color: #238636;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-header">
    <i class="bi bi-shield-lock-fill login-icon"></i>
    <h4 class="mt-3 text-white">Offline Survival Computer</h4>
    <p class="text-muted small">Secure Admin Access</p>
  </div>

  <div class="card-body p-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
      <div class="mb-3">
        <label for="username" class="form-label text-white">Username</label>
        <input type="text"
               class="form-control"
               id="username"
               name="username"
               placeholder="Enter username"
               required
               autofocus />
      </div>

      <div class="mb-4">
        <label for="password" class="form-label text-white">Password</label>
        <input type="password"
               class="form-control"
               id="password"
               name="password"
               placeholder="Enter password"
               required />
      </div>

      <button type="submit" class="btn btn-success w-100 py-2">
        <i class="bi bi-box-arrow-in-right me-2"></i>Login
      </button>
    </form>
  </div>

  <div class="card-footer bg-transparent border-top border-secondary text-center text-muted small py-3">
    <i class="bi bi-wifi-off me-1"></i>Offline-First &bull; Private
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmQ+kqjkBU3bZIjwqHbJMG+SPXWY"
        crossorigin="anonymous"></script>
</body>
</html>
