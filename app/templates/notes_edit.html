{% extends "base.html" %}
{% block title %}{{ 'New Note' if not note else 'Edit Note' }} – Offline Survival Computer{% endblock %}
{% block header %}{{ 'New Note' if not note else 'Edit Note' }}{% endblock %}

{% block content %}
<form method="post">
  <div class="mb-3">
    <label class="form-label text-muted small">Title <span class="text-danger">*</span></label>
    <input type="text" name="title" class="form-control bg-dark text-white border-secondary"
           value="{{ note.title if note else '' }}" placeholder="Note title" required />
  </div>

  <div class="mb-3">
    <label class="form-label text-muted small">Content</label>
    <textarea name="content" id="noteContent"
              class="form-control bg-dark text-white border-secondary font-monospace"
              rows="20" placeholder="Write your note here… Markdown is supported."
              >{{ note.content if note else '' }}</textarea>
  </div>

  <div class="mb-4">
    <label class="form-label text-muted small">Tags</label>
    <input type="text" name="tags" class="form-control bg-dark text-white border-secondary"
           value="{{ note.tags if note else '' }}"
           placeholder="Comma-separated tags, e.g. survival, first-aid, food" />
  </div>

  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-success">
      <i class="bi bi-check-lg me-1"></i>Save
    </button>
    {% if note %}
    <a href="{{ url_for('notes_view', note_id=note.id) }}" class="btn btn-outline-secondary">Cancel</a>
    {% else %}
    <a href="{{ url_for('notes') }}" class="btn btn-outline-secondary">Cancel</a>
    {% endif %}
  </div>
</form>
{% endblock %}
